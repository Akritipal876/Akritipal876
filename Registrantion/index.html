<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X UA Compatible" content="IE=edge">
	  <meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registrantion From</title>
	<link rel="stylesheet" type="text/css" href="Css/styel.css">
</head>
<body>
	<div class="container">
		<form action="" method="post">
			<h2>Registration</h2>
			<div class="content">
				<div  class="input-box">
				<label for="name">Full Name</label>
				<input type="text" placeholder="Enter Full name" name="name" required>
			</div>
			<div  class="input-box">
				<label for="name">Username</label>
				<input type="text" placeholder="Enter  Username" name="name" required>
			</div>
			<div  class="input-box">
				<label for="name">Email</label>
				<input type="text" placeholder="Enter your email" name="name" required>
			</div>
			<div  class="input-box">
				<label for="name">Phone Number</label>
				<input type="text" placeholder="Enter your number" name="name" required>
			</div>
			<div  class="input-box">
				<label for="name">Password</label>
				<input type="text" placeholder="Enter your Password" name="name" required>
			</div>
			<div  class="input-box">
				<label for="name">Confim Password</label>
				<input type="text" placeholder="ConfimPassword" name="name" required>
			</div>
			<span class="gender-title">Gender</span>
			<div class="gender-category">
				<input type="radio" name="gender" id="Male">
				<label for="Male">Male</label>
				<input type="radio" name="gender" id="Female">
				<label for="Female">Female</label>
				<input type="radio" name="gender" id="other">
				<label for="other">Other</label>
			</div>
		</div>
		<div class="alert">
			<p>By clicking sign up,you agree to our<a href="#">Terms</a><a href="#">Privacy Policy</a>and<a href="#">cooking policy </a> you may receive SMS notifications form us and can opt out at any time.</p>
			</div>
			<div class="button-container">
			<button type="submit">Register</button>
			</div>
		</form>
	</body>
</html>
